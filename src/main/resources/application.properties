spring.application.name=TriageIQ
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000
jwt.verification-expiration-ms=172800000

app.admin.bootstrap-key=${ADMIN_BOOTSTRAP_KEY}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile

app.frontend.base-url=${FRONTEND_BASE_URL}
app.frontend.oauth2-redirect-path=${OAUTH2_REDIRECT_PATH}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM}
app.mail.verification-base-url=${MAIL_VERIFICATION_BASE_URL}

# mock (default, no API key needed) or groq (requires spring.ai.openai.* below)
app.ai.provider=groq

spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=${GROQ_BASE_URL}
spring.ai.openai.chat.options.model=${GROQ_MODEL}
spring.ai.openai.chat.options.temperature=${AI_TEMPERATURE}

app.base-url=${APP_BASE_URL}

app.async.core-pool-size=4
app.async.max-pool-size=8
app.async.queue-capacity=100

app.pagination.default-page-size=20
app.pagination.max-page-size=100

logging.level.root=INFO
logging.level.com.example.TriageIQ=DEBUG
logging.level.org.springframework.security=INFO