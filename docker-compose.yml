version: '3.8'

services:
  mysqldb:
    image: mysql:8.0
    container_name: triageiq-mysql

    ports:
      - "3307:3306"

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}

    volumes:
      - ./mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: TriageIQ

    ports:
      - "8081:8080"

    depends_on:
      mysqldb:
        condition: service_healthy

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:${DB_PORT}/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}

      APP_ADMIN_BOOTSTRAP_KEY: ${ADMIN_BOOTSTRAP_KEY}

      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}

      APP_FRONTEND_BASE_URL: ${FRONTEND_BASE_URL}
      APP_FRONTEND_OAUTH2_REDIRECT_PATH: ${OAUTH2_REDIRECT_PATH}
      APP_CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}

      SPRING_MAIL_HOST: ${MAIL_HOST}
      SPRING_MAIL_PORT: ${MAIL_PORT}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD}
      APP_MAIL_FROM: ${MAIL_FROM}
      APP_MAIL_VERIFICATION_BASE_URL: ${MAIL_VERIFICATION_BASE_URL}

      APP_AI_PROVIDER: ${AI_PROVIDER}

      SPRING_AI_OPENAI_API_KEY: ${GROQ_API_KEY}
      SPRING_AI_OPENAI_BASE_URL: ${GROQ_BASE_URL}
      SPRING_AI_OPENAI_CHAT_OPTIONS_MODEL: ${GROQ_MODEL}
      SPRING_AI_OPENAI_CHAT_OPTIONS_TEMPERATURE: ${AI_TEMPERATURE}

      APP_BASE_URL: ${APP_BASE_URL}

volumes:
  mysql_data: